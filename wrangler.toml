name = "lista"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "lista_db"
database_id = "25b87c1b-c6fd-4dfc-8858-5a25388723a6"

# R2 Bucket para fotos
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "my-emdash-media"

# Variables de entorno (secrets via wrangler pages secret)
[vars]
JWT_SECRET = "lista-dev-secret-change-in-prod-2024"
VAPID_SUBJECT = "mailto:admin@lista.edu"
